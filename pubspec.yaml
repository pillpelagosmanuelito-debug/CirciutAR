name: circuitar
description: >-
  CircuitAR — laboratorio móvil para aprender a identificar, comprender,
  seleccionar y aplicar componentes electrónicos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00796B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
