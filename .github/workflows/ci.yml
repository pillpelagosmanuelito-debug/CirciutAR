name: CI · CircuitAR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    name: Análisis, pruebas y APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versión de las herramientas
        run: flutter --version

      # Las carpetas de plataforma no se versionan: se generan aquí con la
      # plantilla oficial de la versión fijada de Flutter.
      - name: Generar la plataforma Android
        run: |
          flutter create --platforms=android --org pe.edu.circuitar --project-name circuitar .
          sed -i 's/android:label="circuitar"/android:label="CircuitAR"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar el ícono de la app
        run: flutter pub run flutter_launcher_icons

      - name: Verificación ligera de imports e identificadores
        run: python3 tools/check_imports.py

      - name: Análisis estático
        run: flutter analyze --no-fatal-infos

      - name: Pruebas (incluye ortografía y contenido)
        run: flutter test --coverage --reporter expanded

      - name: Compilar APK
        run: flutter build apk --release

      - name: Preparar artefacto
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/circuitar-${GITHUB_REF_NAME//\//-}.apk"
          ls -lh dist

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: circuitar-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov.info
          retention-days: 14

  release:
    name: Publicar versión
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: circuitar-apk
          path: dist

      - name: Crear la versión en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
